<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Administrator Login | TableEase</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><nav class="navbar"><a class="logo" href="{{ url_for('home') }}">TableEase</a><ul class="nav-links"><li><a href="{{ url_for('home') }}">Home</a></li></ul></nav></header><main class="login-container"><div class="login-card"><h1>Administrator</h1><p>Sign in to manage restaurant bookings.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="POST" action="{{ url_for('admin_login') }}"><div class="form-group"><label for="email">Administrator Email</label><input type="email" id="email" name="email" autocomplete="username" required></div><div class="form-group"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required></div><button type="submit" class="login-submit">Sign In</button></form></div></main><footer><p>&copy; 2026 TableEase. All rights reserved.</p></footer></body></html>
